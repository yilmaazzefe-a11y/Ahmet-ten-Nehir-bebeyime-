<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Seviyorum Nehir!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* DEĞİŞİKLİK BURADA: Arka planı tamamen siyah yaptık */
            background-color: black;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            /* Yazı rengini beyaz yaptık ki siyah üzerinde görünsün */
            color: white;
            text-align: center;
        }

        .container {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Fotoğraf Alanı: Yuvarlak çerçeveyi siyah arka plana uygun hale getirdik */
        .photo-container {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* Dairesel çerçeve */
            border: 5px solid rgba(255, 255, 255, 0.8); /* Şık beyaz çerçeve */
            box-shadow: 0 0 20px rgba(255,255,255,0.3); /* Hafif beyaz parlama */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Ana Kalp */
        .main-heart {
            font-size: 60px;
            color: #e74c3c;
            animation: beat 0.8s infinite alternate;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(231, 76, 60, 0.5));
        }

        @keyframes beat {
            to { transform: scale(1.1); }
        }

        h1 {
            font-size: 2.8rem;
            margin: 0;
            font-weight: 700;
            /* Yazı rengi zaten gövdeden beyaz olarak geliyor */
            text-shadow: 0 0 10px rgba(255,255,255,0.5); /* Hafif yazı parlaması */
        }

        /* "Seni Seviyorum" Yazısı */
        .love-text {
            font-size: 2rem;
            margin: 0;
            color: #e74c3c; /* Kırmızı */
            font-weight: 600;
            text-shadow: 0 0 10px rgba(231, 76, 60, 0.5); /* Hafif parlama */
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Uçuşan Kalpler - Siyah fonda daha parlak */
        .heart-particle {
            position: absolute;
            color: #ff4d4d;
            font-size: 20px;
            pointer-events: none;
            animation: fall linear forwards;
            filter: drop-shadow(0 0 5px rgba(255,77,77,0.8)); /* Daha güçlü parlama */
        }

        @keyframes fall {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
