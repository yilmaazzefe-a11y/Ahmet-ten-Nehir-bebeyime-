<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Nehir!</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000 !important;
            /* SAYFAYI TAM MERKEZLEME */
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Segoe UI', sans-serif;
        }

        .main-container {
            text-align: center; z-index: 100;
            display: flex; flex-direction: column; align-items: center;
            /* DÜZELTME: Yukarı kaymayı önlemek için otomatik hizalama */
            justify-content: center;
        }

        /* Fotoğraf çerçevesi */
        .photo-box {
            width: 300px; /* İstediğin gibi büyük boyut */
            height: 300px;
            border-radius: 50%;
            border: 5px solid #fff;
            overflow: hidden !important;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        .photo-box img {
            width: 140%; 
            height: 140%; 
            object-fit: cover;
            /* FOTOĞRAFI SOLA KAYDIRMA: %38 değeri resmi sola çeker */
            object-position: 38% 45%; 
            border-radius: 50%;
        }

        /* Yazı ve Kalp Düzeni */
        .main-heart { font-size: 55px; margin-bottom: 10px; }
        h1 { color: white; font-size: 2.5rem; margin: 5px 0; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .love-msg { color: #ff4d4d; font-size: 2rem; font-weight: bold; text-shadow: 0 0 15px rgba(255,77,77,0.5); }

        /* Uçuşan Kalpler */
        .heart {
            position: absolute; color: #ff4d4d; font-size: 25px;
            pointer-events: none; z-index: 1;
            animation: fly linear forwards;
        }

        @keyframes fly {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="photo-box">
            <img src="nehir_foto.png" alt="Nehir">
        </div>
        
        <div class="main-heart">❤️</div>
        <h1>İyi ki doğdun Nehir! 🥳</h1>
        <p class="love-msg">Seni Seviyorum</p>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
