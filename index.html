<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Nehir!</title>
    <style>
        /* Arka planı simsiyah yapıyoruz */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000 !important; /* Kesin Siyah */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* İçerik kutusunu öne çıkarıyoruz */
        .main-container {
            position: relative;
            z-index: 100;
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Fotoğraf çerçevesi */
        .photo-box {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid #fff;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .love-msg {
            font-size: 1.8rem;
            color: #ff4d4d;
            font-weight: bold;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(255,77,77,0.5);
        }

        /* Uçuşan Kalpler */
        .heart {
            position: absolute;
            color: #ff4d4d;
            font-size: 25px;
            pointer-events: none;
            z-index: 1;
            animation: fly linear forwards;
        }

        @keyframes fly {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translateY(100vh) scale(1); }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="photo-box">
            <img src="nehir_foto.png" alt="Nehir">
        </div>

        <div style="font-size: 50px; margin-bottom: 10px;">❤️</div>
        <h1>İyi ki doğdun Nehir! 🥳</h1>
        <p class="love-msg">Seni Seviyorum</p>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 300);
    </script>

</body>
</html>
