<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Nehir!</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000 !important;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Segoe UI', sans-serif;
            flex-direction: column;
        }

        .main-container {
            text-align: center; z-index: 100;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Fotoğraf çerçevesi ve dairesel kırpma */
        .photo-box {
            width: 250px; 
            height: 250px;
            border-radius: 50%;
            border: 4px solid #fff;
            overflow: hidden !important; /* Taşmayı önler */
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            margin-bottom: 15px; /* Kalbe yaklaştırmak için */
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        .photo-box img {
            /* FOTOĞRAFI YUVARLAĞA TAM OTURTMA AYARI */
            width: 145%; /* Yan boşlukları kapatmak için resmi büyüterek dairesel alanı dolduruyoruz */
            height: 145%; 
            object-fit: cover; /* Bu ayar yuvarlağın içini tam sığdırır */
            
            /* DÜZELTME: Fotoğrafı çerçevenin içinden SOLA kaydırdık (%40) */
            /* İlk yüzde sağa/sola (arttırırsan sağa kayar), ikinci yüzde yukarı/aşağı */
            object-position: 40% 45%; 
            
            /* Dairesel kırpmayı garantiler */
            border-radius: 50%;
        }

        /* Kalp simgesi ve yazılar */
        .main-heart { font-size: 55px; margin-bottom: 5px; }
        h1 { color: white; font-size: 2.5rem; margin: 5px 0; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .love-msg { color: #ff4d4d; font-size: 2rem; font-weight: bold; margin-top: 0px; text-shadow: 0 0 15px rgba(255,77,77,0.5); }

        /* Uçuşan Kalpler */
        .heart {
            position: absolute; color: #ff4d4d; font-size: 28px;
            pointer-events: none; z-index: 1;
            animation: fly linear forwards;
        }

        @keyframes fly {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translateY(100vh) scale(1); }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="photo-box">
            <img src="nehir_foto.png" alt="Nehir">
        </div>
        
        <div class="main-heart">❤️</div>
        <h1>İyi ki doğdun Nehir! 🥳</h1>
        <p class="love-msg">Seni Seviyorum</p>
    </div>
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
