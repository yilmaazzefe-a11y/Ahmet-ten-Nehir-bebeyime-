<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz! ❤️ İyi ki Doğdun Nehir...</title>
    <style>
        /* Temel Sayfa Ayarları */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background-color: #000 !important;
            color: white;
            overflow: hidden; /* Taşmayı önle */
            font-family: 'Segoe UI', 'Courier New', sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        /* 1. Matrix Veri Akışı (Arka Plan) */
        #matrix-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; /* Arka planda kalsın */
        }

        /* 2. Giriş ve Geri Sayım Ekranı (Üstte) */
        #intro-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(0,0,0,0.85); /* Matrix'i hafif karart */
            z-index: 10;
        }

        #countdown {
            font-size: 100px; font-weight: bold;
            color: #ff80ab; /* Pembe hacker rengi */
            text-shadow: 0 0 15px #ff80ab;
            margin-bottom: 20px;
        }

        /* Sürpriz Yazı ve Kocaman Kalp */
        .reveal-content {
            display: none; /* Başlangıçta gizli */
            flex-direction: column; align-items: center; text-align: center;
        }

        .pink-title {
            font-size: 3.5rem; color: #ff80ab;
            text-shadow: 0 0 15px #ff80ab; margin-bottom: 15px;
        }

        .giant-pink-heart {
            font-size: 150px; color: #ff80ab;
            text-shadow: 0 0 30px #ff80ab;
            line-height: 1;
        }

        /* 3. Son Kutlama Ekranı (Dairesel Fotoğraf) */
        #final-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: none; /* Başlangıçta gizli */
            flex-direction: column; justify-content: center; align-items: center;
            background: black;
            z-index: 20; /* En üstte */
        }

        /* Dairesel Fotoğraf Çerçevesi */
        .photo-box {
            width: 250px; height: 250px;
            border-radius: 50%; border: 5px solid #fff;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            margin-bottom: 15px;
            display: flex; justify-content: center; align-items: center;
        }

        /* Fotoğrafı Yuvarlağa Tam Oturtma */
        .photo-box img {
            width: 140%; height: 140%;
            object-fit: cover;
            /* Fotoğrafı sola kaydırma ayarı */
            object-position: 38% 45%; 
        }

        /* Yazı ve Kalp Düzeni */
        .main-heart { font-size: 55px; margin-bottom: 5px; }
        h1 { font-size: 2.2rem; margin: 5px 0; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .love-msg { color: #ff4d4d; font-size: 1.8rem; font-weight: bold; text-shadow: 0 0 15px rgba(255,77,77,0.5); }

        /* Uçuşan Kalp Animasyonu */
        .floating-heart {
            position: absolute; color: #ff4d4d;
            font-size: 25px; pointer-events: none;
            z-index: 15; animation: fly linear forwards;
        }

        @keyframes fly {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div id="intro-screen">
        <div id="countdown"></div>
        <div class="reveal-content" id="reveal-group">
            <h2 class="pink-title">Seni Seviyorum Nehir</h2>
            <div class="giant-pink-heart">❤️</div>
        </div>
    </div>

    <div id="final-screen">
        <div class="main-heart">❤️</div>
        <div class="photo-box">
            <img src="nehir_foto.png" alt="Nehir">
        </div>
        <h1>İyi ki doğdun Nehir! 🥳</h1>
        <p class="love-msg">Seni Seviyorum</p>
    </div>

    <script>
        // Matrix Veri Akışı (Pembe Renk, Dağınık)
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const charList = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789$@&%";
        const chars = charList.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; // Hafif karartma efekti
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff80ab'; // Pembe hacker rengi
            ctx.font = fontSize + 'px Courier New';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        const matrixInterval = setInterval(drawMatrix, 40); // Akış hızı

        // Geri Sayım ve Sürpriz Ekran Geçişleri
        const intro = document.getElementById('intro-screen');
        const countdownEl = document.getElementById('countdown');
        const revealGroup = document.getElementById('reveal-group');
        const finalScreen = document.getElementById('final-screen');
        let countdownValue = 3; // 3 saniye geri sayım

        // 1 saniye sonra Geri Sayımı Başlat
        setTimeout(() => {
            countdownEl.textContent = countdownValue;
            
            const countdownInterval = setInterval(() => {
                countdownValue--;
                
                if (countdownValue >= 1) {
                    countdownEl.textContent = countdownValue;
                } else {
                    clearInterval(countdownInterval);
                    countdownEl.style.display = 'none'; // Sayıyı gizle
                    revealGroup.style.display = 'flex'; // Yazıyı ve büyük kalbi göster
                    
                    // Sürpriz yazı 2.5 saniye kalsın
                    setTimeout(() => {
                        intro.style.display = 'none'; // Giriş ekranını sil
                        canvas.style.display = 'none'; // Matrix'i kapat
                        clearInterval(matrixInterval);

                        finalScreen.style.display = 'flex'; // Son kutlama sayfasını aç
                        // Kalp yağmurunu başlat (Hızlandırıldı/Çoğaltıldı)
                        setInterval(spawnHeart, 150); 
                    }, 2500);
                }
            }, 1000);
        }, 1000); // Sayfa yüklendikten 1 saniye sonra başlar

        // Uçuşan Kalp Fonksiyonu
        function spawnHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000); // 6 saniye sonra sil
        }
    </script>
</body>
</html>
