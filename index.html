<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Nehir!</title>
    <style>
        /* Genel sayfa yerleşimi */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000 !important;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Segoe UI', sans-serif;
            flex-direction: column;
        }

        .main-container {
            text-align: center;
            z-index: 100;
            display: flex; /* İçerikleri dikey hizalamak için */
            flex-direction: column;
            align-items: center;
        }

        /* Fotoğraf çerçevesi ve dairesel kırpma */
        .photo-box {
            width: 200px; /* Kompakt boyut */
            height: 200px;
            border-radius: 50%;
            border: 4px solid #fff;
            overflow: hidden; /* Taşmayı önler, dairesel kırpmayı garantiler */
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            
            /* DÜZELTME: Aşağıdaki öğelerle (kalp, yazı) arasındaki boşluğu azalttık */
            margin-bottom: 5px; 
            
            display: flex; justify-content: center; align-items: center;
            position: relative; /* İçindeki resmi kaydırmak için */
        }

        .photo-box img {
            /* FOTOĞRAFI BÜYÜTÜP TAM ORTALAMA VE KIRPMA AYARI: */
            width: 135%; /* Yan boşluğu kapatmak için resmi büyüttük */
            height: 135%; 
            object-fit: cover; /* Bu ayar fotoğrafın içini doldurmasını sağlar */
            
            /* Fotoğrafı çerçevenin içinden manuel sağa (%55) ve aşağı (%55) kaydırdık */
            object-position: 55% 55%; 
        }

        /* Kalp simgesi yerleşimi */
        .heart-icon {
            font-size: 50px;
            
            /* DÜZELTME: Fotoğrafla arasındaki üst boşluğu azalttık */
            margin-top: -10px;
            margin-bottom: 5px; /* Yazıyla arasındaki boşluğu kıstık */
        }

        /* Yazı stilleri */
        h1 { color: white; font-size: 2.2rem; margin: 0 0 5px 0; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        /* DÜZELTME: "Seni Seviyorum" yazısını yukarı kaydırıp h1 ile yakınlaştırdık */
        .love-msg { 
            color: #ff4d4d; 
            font-size: 1.8rem; 
            font-weight: bold; 
            margin-top: 0px; /* Üst boşluğu sıfırladık */
            text-shadow: 0 0 15px rgba(255,77,77,0.5); 
        }

        /* Uçuşan Kalp Animasyonu */
        .heart {
            position: absolute; color: #ff4d4d; font-size: 25px;
            pointer-events: none; z-index: 1;
            animation: fly linear forwards;
        }

        @keyframes fly {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translateY(100vh) scale(1); }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="photo-box">
            <img src="nehir_foto.png" alt="Nehir">
        </div>
        
        <div class="heart-icon">❤️</div>
        <h1>İyi ki doğdun Nehir! 🥳</h1>
        <p class="love-msg">Seni Seviyorum</p>
    </div>
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
