<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Nehir! ❤️</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000 !important;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Segoe UI', 'Courier New', sans-serif;
            color: white; flex-direction: column;
        }

        /* Hacker Veri Akışı (Sadece başlarken görünür) */
        .matrix {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: block;
        }

        /* Geri Sayım Kutusu (Düzeltildi: Tam Ortada ve Bozulmaz) */
        #reveal-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 20;
        }

        #countdown {
            font-size: 100px; font-weight: bold;
            color: #ff80ab;
            text-shadow: 0 0 15px #ff80ab;
            margin-bottom: 20px;
        }

        /* Sürpriz Yazılar ve Büyük Kalp (Yeri Sabitlendi) */
        #reveal-text-box {
            display: flex; flex-direction: column; align-items: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #love-text {
            font-size: 3rem; font-weight: bold;
            color: #ff80ab;
            text-shadow: 0 0 15px rgba(255, 128, 171, 0.7);
            margin-bottom: 0px; /* Kalple arasındaki boşluk sıfırlandı */
        }

        /* Kocaman Pembe Kalp (Yeni Eklendi) */
        #main-big-heart {
            font-size: 150px; /* Çok büyük */
            color: #ff80ab; /* Pembe renk */
            text-shadow: 0 0 30px #ff80ab;
            line-height: 1; margin: 0;
        }

        /* Kutlama Kutusu (Fotoğraflı) (Sıra Düzenlendi: Kalp, Foto, Yazı) */
        .celebration-box {
            display: none; /* Başlangıçta gizli */
            flex-direction: column; align-items: center; text-align: center;
            z-index: 30;
        }

        .photo-box {
            width: 200px; height: 200px; border-radius: 50%; border: 4px solid #fff; overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4); margin-top: 15px; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center;
        }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .main-heart-icon { font-size: 50px; margin-bottom: 5px; }
        h1 { color: white; font-size: 2.2rem; margin: 5px 0; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .love-msg { color: #ff4d4d; font-size: 1.8rem; font-weight: bold; text-shadow: 0 0 15px rgba(255,77,77,0.5); }

        /* Uçuşan Kalpler */
        .heart {
            position: absolute; color: #ff4d4d; font-size: 25px;
            pointer-events: none; z-index: 5;
            animation: fly linear forwards;
        }
        @keyframes fly {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translateY(100vh) scale(1); }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="matrix" class="matrix"></canvas>

    <div id="reveal-container">
        <div id="countdown"></div>
        <div id="reveal-text-box">
            <div id="love-text">Seni Seviyorum Nehir</div>
            <div id="main-big-heart">❤️</div>
        </div>
    </div>

    <div class="celebration-box" id="celebration-box">
        <div class="main-heart-icon">❤️</div>
        
        <div class="photo-box">
            <img src="nehir_foto.png" alt="Nehir">
        </div>
        
        <h1>İyi ki doğdun Nehir! 🥳</h1>
        <p class="love-msg">Seni Seviyorum</p>
    </div>

    <script>
        // Matrix Veri Akışı (Pembe)
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789$@&%";
        const alphabet = letters.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff80ab'; 
            ctx.font = fontSize + 'px Courier New';

            for (let i = 0; i < drops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        const matrixInterval = setInterval(drawMatrix, 40);

        // Geri Sayım ve Sürpriz Mantığı
        const revealContainer = document.getElementById('reveal-container');
        const countdownEl = document.getElementById('countdown');
        const revealTextBox = document.getElementById('reveal-text-box');
        const celebrationBox = document.getElementById('celebration-box');
        let countdownValue = 3;

        // 1 saniye sonra Geri Sayım Başlar
        setTimeout(() => {
            revealContainer.style.opacity = '1';
            
            countdownEl.textContent = countdownValue;
            const countdownInterval = setInterval(() => {
                countdownValue--;
                if (countdownValue >= 1) {
                    countdownEl.textContent = countdownValue;
                } else {
                    clearInterval(countdownInterval);
                    countdownEl.textContent = "";
                    // Geri sayım bitti, yazıyı ve o büyük kalbi göster
                    revealTextBox.style.opacity = '1';
                    
                    // "Seni Seviyorum Nehir" yazısı ve kocaman kalp 2.5 saniye kalsın
                    setTimeout(() => {
                        revealContainer.style.display = 'none';
                        // Matrix efektini sil (En sona koyduk)
                        canvas.style.display = 'none';
                        clearInterval(matrixInterval);

                        // Son ekran açılır (Doğum günü ekranı)
                        celebrationBox.style.display = 'flex';
                        // Uçuşan kalpler başlar
                        setInterval(createHeart, 300);
                        
                    }, 2500);
                }
            }, 1000);
        }, 1000);

        // Uçuşan Kalp Fonksiyonu
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
    </script>
</body>
</html>
