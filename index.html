<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Nehir!</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            flex-direction: column;
        }

        .main-container {
            text-align: center;
            z-index: 100;
        }

        /* Fotoğraf çerçevesi */
        .photo-box {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid #fff;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Düzeltme: Fotoğrafı çerçevenin içinde ortaladık */
        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Bu ayar fotoğrafın içini doldurmasını sağlar */
        }

        h1 {
            color: white;
            font-size: 2rem;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .love-msg {
            color: #ff4d4d;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,77,77,0.5);
        }

        /* Kalpler */
        .heart {
            position: absolute;
            color: #ff4d4d;
            font-size: 25px;
            z-index: 1;
            animation: fly linear forwards;
        }

        @keyframes fly {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translateY(100vh) scale(1); }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="photo-box">
