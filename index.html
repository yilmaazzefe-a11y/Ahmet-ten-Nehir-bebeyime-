<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nehir için Sürpriz ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; background: #000; 
            overflow: hidden; font-family: 'Arial', sans-serif; 
        }

        /* 1. HACKER YAZILARI (Şeffaf Değil, Net ve Arka Planda) */
        #matrix-canvas {
            position: fixed; top: 0; left: 0; z-index: 1;
        }

        /* 2. GERİ SAYIM VE SIRALI MESAJ */
        #intro-overlay {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: black;
        }

        #num-box { font-size: 120px; color: #ff80ab; font-weight: bold; text-shadow: 0 0 20px #ff80ab; }
        
        .message-group { display: none; flex-direction: column; align-items: center; }
        .pink-text { font-size: 3.5rem; color: #ff80ab; text-shadow: 0 0 20px #ff80ab; text-align: center; }
        .giant-heart { font-size: 160px; color: #ff80ab; margin-top: 10px; filter: drop-shadow(0 0 25px #ff80ab); }

        /* 3. SON EKRAN (Kalp Fotoğrafın Altında ve Kalpler Uçuşuyor) */
        #final-page {
            position: fixed; inset: 0; z-index: 20;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.3); 
            text-align: center;
        }

        .circle-frame {
            width: 230px; height: 230px; border-radius: 50%;
            border: 5px solid #fff; overflow: hidden;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.5);
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px;
        }

        .circle-frame img {
            width: 150%; height: 150%; object-fit: cover;
            /* FOTOĞRAF SOLA KAYDIRILDI: 38'den 30'a çekildi */
            object-position: 40% 45%; 
        }

        .red-heart-under { font-size: 70px; margin-bottom: 15px; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .final-title { color: white; font-size: 2.6rem; margin-bottom: 10px; text-shadow: 0 0 10px black; }
        .final-sub { color: #ff4d4d; font-size: 2.2rem; font-weight: bold; text-shadow: 0 0 15px #ff4d4d; }

        /* UÇUŞAN KALPLER */
        .rain-heart {
            position: absolute; color: #ff4d4d; pointer-events: none;
            z-index: 15; animation: fall linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div id="intro-overlay">
        <div id="num-box">3</div>
        <div class="message-group" id="msg-group">
            <h2 class="pink-text">Seni Seviyorum Nehir</h2>
            <div class="giant-heart">❤️</div>
        </div>
    </div>

    <div id="final-page">
        <div class="circle-frame">
            <img src="nehir_foto.png" alt="Nehir">
        </div>
        <div class="red-heart-under">❤️</div>
        <h1 class="final-title">İyi ki doğdun Nehir! 🥳</h1>
        <p class="final-sub">Seni Seviyorum</p>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";
        const fontSize = 18;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#ff80ab"; 
            ctx.font = "bold " + fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            }
        }
        const mInterval = setInterval(drawMatrix, 50);

        let count = 3;
        const countBox = document.getElementById('num-box');
        const intro = document.getElementById('intro-overlay');
        const msgGroup = document.getElementById('msg-group');
        const finalPage = document.getElementById('final-page');

        const cd = setInterval(() => {
            count--;
            if(count > 0) {
                countBox.textContent = count;
            } else {
                clearInterval(cd);
                countBox.style.display = 'none';
                msgGroup.style.display = 'flex';
                
                setTimeout(() => {
                    intro.style.display = 'none';
                    finalPage.style.display = 'flex';
                    setInterval(makeHeart, 150); 
                }, 2500);
            }
        }, 1000);

        function makeHeart() {
            const h = document.createElement('div');
            h.className = 'rain-heart';
            h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (Math.random() * 20 + 25) + 'px';
            h.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 4000);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
