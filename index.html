<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Seviyorum Nehir!</title>
    <style>
        /* Tüm ekranı siyah yap ve içeriği ortala */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000; /* Kesin siyah */
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: white;
            text-align: center;
        }

        /* İçerik kutusunu en üste çıkar */
        .container {
            position: relative;
            z-index: 999; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Fotoğrafı yuvarlak ve görünür yap */
        .photo-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            overflow: hidden;
            margin-bottom: 20px;
            background-color: #222; /* Fotoğraf yüklenene kadar boş kalmasın */
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .main-heart {
            font-size: 50px;
            margin: 10px 0;
            animation: beat 0.8s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }
