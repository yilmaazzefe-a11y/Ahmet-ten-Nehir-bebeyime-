<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Nehir!</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000 !important;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Segoe UI', sans-serif;
            flex-direction: column;
        }

        .main-container {
            text-align: center;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Fotoğraf çerçevesi ve dairesel kırpma garantisi */
        .photo-box {
            width: 200px; /* Biraz daha kompakt yaptık */
            height: 200px;
            border-radius: 50%;
            border: 4px solid #fff;
            /* TAŞMAYI ÖNLEYEN EN ÖNEMLİ SATIR: */
            overflow: hidden !important; 
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            
            /* DÜZELTME: Yuvarlağı aşağıya, kalbe yaklaştırma ayarı */
            margin-bottom: 10px; /* Kalple arasındaki boşluğu kıstık */
            margin-top: 20px; /* Üstten biraz boşluk verdik, çok yukarıda durmasın */
            
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .photo-box img {
            /* FOTOĞRAFI BÜYÜTÜP TAM ORTALAMA VE KIRPMA AYARI */
            width: 100%; /* Çerçevenin genişliğini tam doldur */
            height: 100%; /* Çerçevenin yüksekliğini tam doldur */
            object-fit: cover; /* Taşmayı önleyerek içini doldur */
            object-position: 50% 50%; /* Tam merkeze odakla */
            
            /* Dairesel kırpmayı garanti altına alalım */
            border-radius: 50%;
        }

        /* Kalp simgesi yerleşimi */
        .main-heart {
            font-size: 50px;
            margin-bottom: 5px; /* Yazıyla arasındaki boşluğu kıstık */
            position: relative;
            z-index: 110; /* Fotoğrafın üzerinde durmasını sağlamak için */
        }

        /* Yazı stilleri */
        h1 { color: white; font-size: 2.2rem; margin: 5px 0; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .love-msg { color: #ff4d4d; font-size: 1.8rem; font-weight: bold; margin-top: 0px; text-shadow: 0 0 15px rgba(255,77,77,0.5); }

        .heart {
            position: absolute; color: #ff4d4d; font-size: 25px;
            pointer-events: none; z-index: 1;
            animation: fly linear forwards;
        }

        @keyframes fly {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translateY(100vh) scale(1); }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="photo-box">
            <img src="nehir_foto.png" alt="Nehir">
        </div>
        
        <div class="main-heart">❤️</div>
        <h1>İyi ki doğdun Nehir! 🥳</h1>
        <p class="love-msg">Seni Seviyorum</p>
    </div>
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
